[project]
name = "hellofairy"
version = "0.1.0"
description = "Terminal control for Hello Fairy BLE lights, incl. 20x20 curtain image upload"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22", "pillow>=10", "certifi"]

[project.optional-dependencies]
camera = ["opencv-python-headless", "numpy"]

[project.scripts]
fairy = "hellofairy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hellofairy"]
